tips:
  - "設定を開くには /lkjmcsmp settings を使います。"
  - "Settings メニューでは言語、ホットバー項目、アクションバー設定を変更できます。"
  - "ホットバー項目を切り替えるには /lkjmcsmp settings hotbar を使います。"
  - "ホットバー項目を無効にすると、星アイテムはすぐに削除されます。"
  - "プラグインのアクションバー表示を切り替えるには /lkjmcsmp settings actionbar を使います。"
  - "アクションバーを無効にしてもチャットメッセージは無効になりません。"
  - "英語へ切り替えるには /lkjmcsmp language en を使います。"
  - "日本語へ切り替えるには /lkjmcsmp language ja を使います。"
  - "Language メニューには言語レジストリの言語が表示されます。"
  - "未対応の言語コードはデフォルト言語へフォールバックします。"
  - "ローカライズ済みのメニューラベルは選択言語で表示されます。"
  - "実績名と説明は選択言語で表示されます。"
  - "ヒントは送信時点の選択言語で表示されます。"
  - "アクションバーにはポイント、プレイ時間、オンライン数を表示できます。"
  - "設定はプレイヤー UUID ごとに保存されます。"
  - "設定を変更するまではデフォルト設定が使われます。"
  - "ホットバーのメニュー項目はスロット 8 を使います。"
  - "ホットバーのメニュー項目は通常のインベントリ移動から保護されます。"
  - "ホットバー項目を無効にした場合でも /menu はいつでも使えます。"
  - "アカウント関連の状態を見るには Profile メニューを使います。"

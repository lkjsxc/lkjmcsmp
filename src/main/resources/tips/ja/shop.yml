tips:
  - "ポイントショップを開くには /shop を使います。"
  - "ルートコマンドからポイントショップを開くには /lkjmcsmp shop を使います。"
  - "丸石をポイントに変換するには /convert cobblestone 64 を使います。"
  - "インベントリ内の丸石をすべて変換するには /lkjmcsmp shop convert を使います。"
  - "ショップの Convert Cobblestone ボタンは手持ちではなくインベントリ全体を確認します。"
  - "ショップ詳細では 1、2、4、8、16、32、64 個の正確な数量を購入できます。"
  - "オークの原木を 16 個買うには /shop buy oak_log 16 を使います。"
  - "ルートコマンドで買うには /lkjmcsmp shop buy spruce_log 8 を使います。"
  - "原木価格は個数単位で、原木 1 個は 8 ポイントです。"
  - "ショップはアイテム付与前にポイント残高を確認します。"
  - "通常アイテム購入では、先にインベントリ空き容量を確認します。"
  - "サービスショップ項目は 1 回に 1 個だけ購入できます。"
  - "一時ディメンションパスはサービスショップ項目です。"
  - "ホーム枠アップグレードはポイントショップではなく Homes から購入します。"
  - "ショップ一覧は、未設定の項目だけを表示しません。"
  - "ショップ詳細のポイント残高アイテムで現在の残高を確認できます。"
  - "サービス購入に失敗した場合、差し引かれたポイントは正確に返金されます。"
  - "/shop buy の後で補完するとショップ項目キーを確認できます。"
  - "ショップ詳細の Back ボタンで項目一覧へ戻れます。"
  - "季節ショップ上書きには economy override 権限が必要です。"

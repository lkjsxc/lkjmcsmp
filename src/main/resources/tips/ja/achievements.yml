tips:
  - "実績メニューを開くには /achievement を使います。"
  - "/achievement の短い別名として /ach が使えます。"
  - "チャットで実績進捗を見るには /achievement list を使います。"
  - "完了した報酬を受け取るには /achievement claim key を使います。"
  - "ルートコマンドから実績を開くには /lkjmcsmp achievement を使います。"
  - "ルートコマンドで進捗一覧を見るには /lkjmcsmp achievement list を使います。"
  - "ルートコマンドで受け取るには /lkjmcsmp achievement claim key を使います。"
  - "実績報酬は受け取り時にポイントを付与します。"
  - "実績メニューには未達成、進行中、受け取り可能、受け取り済みが表示されます。"
  - "実績の進捗説明には現在値、目標値、割合が表示されます。"
  - "受け取り可能な実績はメニュー内でクリックできます。"
  - "受け取り済み実績も履歴として表示され続けます。"
  - "変換実績は丸石を変換すると進みます。"
  - "ショップ実績はショップ項目を購入すると進みます。"
  - "テレポート実績はテレポート操作の完了で進みます。"
  - "ホーム実績はホームを作成すると進みます。"
  - "ワープ実績はワープを使うと進みます。"
  - "パーティ実績はチーム参加や利用で進みます。"
  - "実績表示テキストはローカライズされています。"
  - "/achievement claim の後で補完すると実績キーを確認できます。"

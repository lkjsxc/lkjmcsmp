tips:
  - "削除操作は通常クリックで消えないように明示的な流れを使います。"
  - "Homes 削除ページでは TNT アイコンで削除操作と移動操作を分けています。"
  - "チーム解散には確認メニューが必要です。"
  - "テレポート依頼は設定された時間で期限切れになります。"
  - "テレポートの移動チェックはカウントダウン悪用を防ぎます。"
  - "ポイント不足の購入は差し引き前に失敗します。"
  - "インベントリ空き不足の通常購入は差し引き前に失敗します。"
  - "サービス購入に失敗した場合はポイントが返金されます。"
  - "一時ディメンション作成失敗時もポイントが返金されます。"
  - "ポイント台帳は残高変動を記録します。"
  - "残高は 0 未満になりません。"
  - "装飾用のメニューペインは操作を実行しません。"
  - "メニュー操作は翻訳された表示名ではなく内部メタデータを使います。"
  - "ホットバーメニュートークンはドロップや迷子スロットから削除されます。"
  - "アクションバーを無効化したプレイヤーにはプラグインの表示を送りません。"
  - "利用不能なワールドのホームやワープは明確なメッセージで失敗します。"
  - "未知のメニュー操作は安全でない既定処理をせず拒否されます。"
  - "OP 向けコマンドは権限で制限されています。"
  - "RTP は設定されたワールド許可リストと半径制限を使います。"
  - "一時ディメンションの退出は安全な退避のために追跡されます。"

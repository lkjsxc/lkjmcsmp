tips:
  - "許可されたワールドでランダムテレポートするには /rtp を使います。"
  - "ルートコマンドからランダムテレポートするには /lkjmcsmp teleport rtp を使います。"
  - "別のプレイヤーの場所へ行きたい時は /tpa player で依頼します。"
  - "相手を自分の場所へ呼びたい時は /tpahere player を使います。"
  - "最新のテレポート依頼を承認するには /tpaccept を使います。"
  - "最新のテレポート依頼を拒否するには /tpdeny を使います。"
  - "複数依頼がある場合は /tpaccept player で相手を指定します。"
  - "Teleport メニューは複数依頼がある時に依頼者ピッカーを開けます。"
  - "テレポートのカウントダウン中に大きく動くとキャンセルされます。"
  - "テレポート結果はチャットと、有効ならアクションバーに表示されます。"
  - "Teleport メニューを開くには /lkjmcsmp teleport を使います。"
  - "ルートコマンドで依頼するには /lkjmcsmp teleport tpa player を使います。"
  - "相手を呼ぶルートコマンドは /lkjmcsmp teleport tpahere player です。"
  - "指定した依頼を承認するには /lkjmcsmp teleport accept player を使います。"
  - "指定した依頼を拒否するには /lkjmcsmp teleport deny player を使います。"
  - "直接 /tp は権限制限があり、通常プレイヤーではロックされる場合があります。"
  - "Teleport メニューには直接テレポートがロック中か表示されます。"
  - "設定されている場合、初期スポーン範囲の RTP が自動発火します。"
  - "死亡後ランダムテレポートは危険なスポーンループを避ける助けになります。"
  - "/lkjmcsmp teleport の後で補完するとテレポート操作を確認できます。"

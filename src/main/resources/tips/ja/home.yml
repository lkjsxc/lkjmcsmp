tips:
  - "現在地を次の空きホーム名で保存するには /home create を使います。"
  - "base というホームを保存または更新するには /home create base を使います。"
  - "home という名前のホームがある場合、/home でそこへ移動できます。"
  - "特定のホームへ移動するには /home go base を使います。"
  - "保存済みホームの一覧を見るには /homes を使います。"
  - "不要なホームを消すには /home delete base を使います。"
  - "/menu から Homes を開き、Create Home をクリックすると現在地を保存できます。"
  - "Homes メニューには現在のホーム数と上限が表示されます。"
  - "ホーム名は正規化されるため、Base と base は同じホームを指します。"
  - "ルートコマンドからホームを作るには /lkjmcsmp home create を使います。"
  - "/lkjmcsmp home list は /homes のルートコマンド版です。"
  - "明示的なルートコマンドが好みなら /lkjmcsmp home go base を使います。"
  - "ルートコマンドからホームを消すには /lkjmcsmp home delete base を使います。"
  - "Homes メニューの Buy Next Home Slot は個人のホーム上限を増やします。"
  - "次のホーム枠を購入するには /lkjmcsmp home buy-slot を使います。"
  - "ホーム枠アップグレードは順番に購入し、最初は 600 ポイントです。"
  - "ホーム削除ページは通常クリックで誤削除しないように分離されています。"
  - "名前なしでホームを作ると、最初に空いている home-N 名が使われます。"
  - "/home の後で補完すると create、list、go、delete、buy-slot を確認できます。"
  - "名前空間付きの /lkjmcsmp:home でも /home と同じ補完が使えます。"

tips:
  - "チームを作るには /team create name を使います。"
  - "Team メニューを開くには /lkjmcsmp team を使います。"
  - "誰かをチームに招待するには /team invite player を使います。"
  - "保留中のチーム招待を承認するには /team accept を使います。"
  - "権限がある時にメンバーを外すには /team kick player を使います。"
  - "現在のチームから抜けるには /team leave を使います。"
  - "自分がリーダーのチームを解散するには /team disband を使います。"
  - "Team メニューではチーム解散前に確認画面が出ます。"
  - "現在のチーム ID を見るには /team info を使います。"
  - "チームメンバーへメッセージを送るには /team chat message を使います。"
  - "チームホームが設定済みなら /team home で移動できます。"
  - "Team メニューはチーム未参加時にロック中の操作を表示します。"
  - "リーダー専用のチーム操作はリーダーだけが使えます。"
  - "Team メニューの招待ピッカーにはオンラインプレイヤーが表示されます。"
  - "チーム招待は設定された期限後に失効します。"
  - "Profile メニューには現在のチーム情報が表示されます。"
  - "ルートコマンド経由で招待するには /lkjmcsmp team invite player を使います。"
  - "ルートコマンド経由でチームホームへ行くには /lkjmcsmp team home を使います。"
  - "/lkjmcsmp team の後で補完するとチーム操作を確認できます。"
  - "team home や team chat を使う前にチームを作成しましょう。"

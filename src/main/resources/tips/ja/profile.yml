tips:
  - "プロフィールを開くには /profile を使います。"
  - "ルートコマンドからプロフィールを開くには /lkjmcsmp profile を使います。"
  - "Profile メニューにはポイント残高が表示されます。"
  - "Profile メニューには現在のチーム状態が表示されます。"
  - "Profile メニューから Achievement メニューへ移動できます。"
  - "Profile メニューには実績完了数が表示されます。"
  - "利用可能な場合、Profile メニューにはプレイ時間が表示されます。"
  - "Profile のチーム項目をクリックすると Team メニューを開けます。"
  - "Profile の実績項目をクリックすると実績を開けます。"
  - "手早く自分の状態を確認したい時は Profile を使います。"
  - "Profile のポイント項目はひまわりアイコンです。"
  - "Profile のチーム項目は自分のプレイヤーヘッドを使います。"
  - "Profile は読み取り専用で、通常プレイ中に安全に開けます。"
  - "Profile はローカライズ済みのテキストを選択言語で表示します。"
  - "Profile でチーム参加中か確認できます。"
  - "Profile で未受け取りの実績報酬があるか確認できます。"
  - "Profile はルートメニューからも開けます。"
  - "GUI ナビゲーションが好みなら /menu から Profile を開きます。"
  - "/lkjmcsmp の後で補完すると profile トピックを見つけられます。"
  - "実績獲得後は Profile で進捗を確認してみましょう。"

tips:
  - "一時ディメンションパスはポイントショップで購入できます。"
  - "一時ディメンションパスは隔離された時間制限付きワールドを作成します。"
  - "直接購入するには /tempdim purchase を使います。"
  - "有効な一時ディメンション一覧を見るには /tempdim list を使います。"
  - "特定の一時ディメンションを見るには /tempdim info id を使います。"
  - "一時ディメンションは End、Nether、Overworld 環境を使えます。"
  - "一時ディメンションの既定時間は分単位で設定されます。"
  - "一時ディメンション作成は有効化完了後に最終成功を報告します。"
  - "作成に失敗した場合、差し引かれたポイントは返金されます。"
  - "一時ディメンションのサービス購入はインベントリ容量チェックを行いません。"
  - "一時ディメンションはライフサイクル処理のため参加者を追跡します。"
  - "一時ディメンションを離れると一時 HUD 状態が消えます。"
  - "一時ディメンションに入ると残り時間がアクションバーに出る場合があります。"
  - "一時ディメンションのクリーンアップは設定されたライフサイクルで動作します。"
  - "権限がある管理者は一時ディメンションを強制終了できます。"
  - "一時ディメンションパスはブロックではなくサービス項目です。"
  - "購入確認にはポイントショップ詳細ページを使います。"
  - "一時ディメンション転送は設定された半径を使います。"
  - "一時ディメンション終了時、プレイヤーは安全に外へ移動されます。"
  - "共有ランの調整前に /tempdim info で状態を確認しましょう。"

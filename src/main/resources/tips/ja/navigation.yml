tips:
  - "メインメニューを開くには /menu を使います。"
  - "/menu のルートコマンド版として /lkjmcsmp menu も使えます。"
  - "ホットバー項目が有効なら、星アイテムでメインメニューを開けます。"
  - "メニューの Back 矢印で前のメニューへ戻れます。"
  - "ルートメニューのバリアアイテムでメニューを閉じられます。"
  - "ページ付きメニューでは矢印で前後のページへ移動します。"
  - "ページアイテムには現在のページ番号が表示されます。"
  - "多くのメニュー操作には、入力派向けの対応コマンドがあります。"
  - "ルートコマンド一覧を見るには /lkjmcsmp help を使います。"
  - "ホーム関連のルートコマンドを見るには /lkjmcsmp help home を使います。"
  - "ショップの短縮コマンドを見るには /lkjmcsmp help shop を使います。"
  - "テレポートの短縮コマンドを見るには /lkjmcsmp help teleport を使います。"
  - "ワープの短縮コマンドを見るには /lkjmcsmp help warps を使います。"
  - "/lkjmcsmp の短い別名として /lkj が使えます。"
  - "ルートコマンドには home、shop、teleport、team、settings、profile があります。"
  - "/lkjmcsmp の後で補完すると最上位トピックを確認できます。"
  - "/lkjmcsmp home の中ではホーム名も補完できます。"
  - "/lkjmcsmp shop buy の中ではショップ項目キーを補完できます。"
  - "/lkjmcsmp language の中では利用可能な言語コードを補完できます。"
  - "自分の状態を見るには /profile または Profile メニューを使います。"

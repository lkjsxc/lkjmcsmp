tips:
  - "Use /menu to open the main navigation menu."
  - "Use /lkjmcsmp menu when you want the root command version of /menu."
  - "The hotbar star opens the main menu when the hotbar menu item is enabled."
  - "Use the Back arrow in menus to return to the previous menu."
  - "Use the barrier item in the root menu to close the menu."
  - "Paged menus use arrows for previous and next pages."
  - "The page item in a menu shows your current page number."
  - "Most menu actions have matching commands for players who prefer typing."
  - "Use /lkjmcsmp help to see the root command index."
  - "Use /lkjmcsmp help home to see Home-related root commands."
  - "Use /lkjmcsmp help shop to see shop command shortcuts."
  - "Use /lkjmcsmp help teleport to see teleport command shortcuts."
  - "Use /lkjmcsmp help warps to see warp command shortcuts."
  - "Use /lkj as the short alias for /lkjmcsmp."
  - "Root command topics include home, shop, teleport, team, settings, and profile."
  - "Tab completion works after /lkjmcsmp to discover top-level topics."
  - "Tab completion works inside /lkjmcsmp home for home names."
  - "Tab completion works inside /lkjmcsmp shop buy for shop item keys."
  - "Tab completion works inside /lkjmcsmp language for available language codes."
  - "Use /profile or the Profile menu item to inspect your own status."

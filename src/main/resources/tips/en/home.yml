tips:
  - "Use /home create to save your current location as the next available home."
  - "Use /home create base to save or update a home named base."
  - "Use /home to teleport to your default home when you have one named home."
  - "Use /home go base to teleport to a specific named home."
  - "Use /homes to list every home you have saved."
  - "Use /home delete base when you no longer need a named home."
  - "Open /menu, choose Homes, and click Create Home to save your location."
  - "The Homes menu shows your current home count and current limit."
  - "Home names are normalized, so Base and base point to the same home."
  - "Use /lkjmcsmp home create to create a home through the root command."
  - "Use /lkjmcsmp home list for the root-command version of /homes."
  - "Use /lkjmcsmp home go base when you prefer explicit root commands."
  - "Use /lkjmcsmp home delete base to delete a home from the root command."
  - "Buy Next Home Slot in the Homes menu increases your personal home limit."
  - "Use /lkjmcsmp home buy-slot to buy the next Home slot upgrade."
  - "Home slot upgrades are bought in order and start at 600 Points."
  - "The Home deletion page is separate so normal clicks cannot delete homes by accident."
  - "A home created without a name uses the first free home-N name."
  - "Use tab completion after /home to discover create, list, go, delete, and buy-slot."
  - "The namespaced command /lkjmcsmp:home supports the same tab completion as /home."

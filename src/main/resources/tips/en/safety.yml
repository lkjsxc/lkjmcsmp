tips:
  - "Deletion actions use explicit flows so normal clicks do not delete data."
  - "The Homes deletion page uses TNT icons to separate delete actions from teleport actions."
  - "Team disband requires a confirmation menu."
  - "Teleport requests expire after the configured timeout."
  - "Teleport movement checks prevent countdown abuse."
  - "Points purchases fail before deduction when your balance is too low."
  - "Material purchases fail before deduction when inventory space is too low."
  - "Service purchase failures refund deducted Points."
  - "Temporary dimension creation failures refund deducted Points."
  - "The points ledger records balance mutations."
  - "Balances cannot go below zero."
  - "Decorative menu panes do not trigger actions."
  - "Menu actions use internal metadata instead of translated display text."
  - "The hotbar menu token is removed from drops and stray inventory slots."
  - "The plugin avoids sending action-bar messages to players who disabled them."
  - "World-unavailable home or warp teleports fail with a clear message."
  - "Unknown menu actions are rejected instead of running unsafe defaults."
  - "Operator-only commands are permission-gated."
  - "RTP uses configured world whitelist and radius limits."
  - "Temporary dimension exits are tracked so players can be evacuated safely."

tips:
  - "Use /lkjmcsmp settings to open settings."
  - "Use the Settings menu to change language, hotbar menu, and action bar preferences."
  - "Use /lkjmcsmp settings hotbar to toggle the hotbar menu item."
  - "When the hotbar menu item is disabled, the star is removed immediately."
  - "Use /lkjmcsmp settings actionbar to toggle plugin action-bar messages."
  - "Disabling the action bar does not disable chat messages."
  - "Use /lkjmcsmp language en to switch to English."
  - "Use /lkjmcsmp language ja to switch to Japanese."
  - "The Language menu lists languages from the language registry."
  - "Unsupported language codes fall back to the default language."
  - "Menu labels use your selected language when localized text exists."
  - "Achievement names and descriptions use your selected language."
  - "Tips use your selected language at the moment they are sent."
  - "The action bar can show Points, playtime, and online count."
  - "Settings are saved by player UUID."
  - "Default settings are used until you change a preference."
  - "The hotbar menu item uses slot 8."
  - "The hotbar menu item is protected from normal inventory movement."
  - "Use /menu any time if the hotbar item is disabled."
  - "Use the Profile menu to review account-related status."

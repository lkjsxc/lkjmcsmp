tips:
  - "Use /team create name to create a team."
  - "Use /lkjmcsmp team to open the Team menu."
  - "Use /team invite player to invite someone to your team."
  - "Use /team accept to accept a pending team invite."
  - "Use /team kick player to remove a member when you have permission."
  - "Use /team leave to leave your current team."
  - "Use /team disband to disband a team you lead."
  - "The Team menu asks for confirmation before disbanding a team."
  - "Use /team info to show your current team id."
  - "Use /team chat message to send a message to team members."
  - "Use /team home to teleport to your team home when one is set."
  - "The Team menu shows locked actions when you are not in a team."
  - "Only team leaders can use leader-only team actions."
  - "The invite picker in the Team menu lists online players."
  - "Team invites expire after the configured timeout."
  - "The Profile menu shows your current team information."
  - "Use /lkjmcsmp team invite player to delegate through the root command."
  - "Use /lkjmcsmp team home to route through the root command."
  - "Use tab completion after /lkjmcsmp team to discover team actions."
  - "Create a team before using team home or team chat."

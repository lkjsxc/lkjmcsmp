tips:
  - "Use /shop to open the Points Shop."
  - "Use /lkjmcsmp shop to open the Points Shop from the root command."
  - "Use /convert cobblestone 64 to turn cobblestone into Points."
  - "Use /lkjmcsmp shop convert to convert all cobblestone in your inventory."
  - "The shop Convert Cobblestone button ignores your held item and checks your whole inventory."
  - "Shop detail pages let you buy exact quantities such as 1, 2, 4, 8, 16, 32, or 64."
  - "Use /shop buy oak_log 16 to buy exactly 16 oak logs."
  - "Use /lkjmcsmp shop buy spruce_log 8 for root-command shop purchases."
  - "Log prices are per item, so one log costs 8 Points."
  - "The shop checks your Points balance before it gives items."
  - "The shop checks inventory space before material purchases."
  - "Service shop items are bought one at a time."
  - "Temporary dimension passes are service shop items."
  - "Home slot upgrades are not in the Points Shop; buy them from Homes."
  - "The shop list hides items you cannot buy only when the item is not configured."
  - "The Points balance item in shop detail shows your current balance."
  - "Failed service purchases refund the exact deducted Points."
  - "Use tab completion after /shop buy to discover shop item keys."
  - "Use the shop Back button to return from detail pages to the item list."
  - "Seasonal shop overrides require the economy override permission."

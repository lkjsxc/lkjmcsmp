tips:
  - "Use /profile to open your profile."
  - "Use /lkjmcsmp profile to open your profile from the root command."
  - "The Profile menu shows your Points balance."
  - "The Profile menu shows your current team status."
  - "The Profile menu links to the Achievement menu."
  - "The Profile menu shows achievement completion counts."
  - "The Profile menu shows playtime information when available."
  - "Click the team item in Profile to open the Team menu."
  - "Click the achievement item in Profile to open achievements."
  - "Use Profile when you want a quick account overview."
  - "The Points item in Profile uses a sunflower icon."
  - "The Team item in Profile uses your player head."
  - "Profile is read-only and safe to open during normal play."
  - "Profile respects your selected language where localized text exists."
  - "Profile can help confirm whether you are in a team."
  - "Profile can help confirm whether achievement rewards are waiting."
  - "Profile is also reachable from the root menu."
  - "Use /menu then Profile if you prefer GUI navigation."
  - "Use tab completion after /lkjmcsmp to find the profile topic."
  - "Check Profile after earning achievements to review progress."

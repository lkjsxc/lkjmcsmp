tips:
  - "Buy a temporary dimension pass from the Points Shop."
  - "Temporary dimension passes create isolated time-limited worlds."
  - "Use /tempdim purchase to buy a temporary dimension pass directly."
  - "Use /tempdim list to list active temporary dimension instances."
  - "Use /tempdim info id to inspect a specific temporary dimension."
  - "Temporary dimensions can use End, Nether, or Overworld environments."
  - "The default temporary dimension duration is configured in minutes."
  - "Temporary dimension creation reports final success only after activation completes."
  - "If temporary dimension creation fails, deducted Points are refunded."
  - "Temporary dimension service purchases skip inventory capacity checks."
  - "Temporary dimensions track participants for lifecycle handling."
  - "Leaving a temporary dimension clears temporary HUD state."
  - "Entering a temporary dimension can show remaining time on the action bar."
  - "Temporary dimension cleanup runs on the configured lifecycle path."
  - "Admins can force close temporary dimensions when permitted."
  - "A temporary dimension pass is a service item, not a block item."
  - "Use the Points Shop detail page to confirm the pass purchase."
  - "Temporary dimension transfer uses a configured radius."
  - "Players are moved out safely when temporary dimensions close."
  - "Check /tempdim info before coordinating a shared temporary dimension run."

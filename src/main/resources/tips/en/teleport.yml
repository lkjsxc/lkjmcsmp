tips:
  - "Use /rtp to random teleport in an allowed world."
  - "Use /lkjmcsmp teleport rtp for the root-command random teleport route."
  - "Use /tpa player to ask to teleport to another player."
  - "Use /tpahere player to ask another player to come to you."
  - "Use /tpaccept to accept the latest pending teleport request."
  - "Use /tpdeny to deny the latest pending teleport request."
  - "Use /tpaccept player when multiple players have pending requests."
  - "The Teleport menu can open requester pickers when multiple requests exist."
  - "Teleport countdowns cancel if you move too far before completion."
  - "Teleport results appear in chat and on the action bar when enabled."
  - "Use /lkjmcsmp teleport to open the Teleport menu."
  - "Use /lkjmcsmp teleport tpa player for the root-command request route."
  - "Use /lkjmcsmp teleport tpahere player to request a player to come to you."
  - "Use /lkjmcsmp teleport accept player to accept a named request."
  - "Use /lkjmcsmp teleport deny player to deny a named request."
  - "Direct /tp is permission-gated and may be locked for normal players."
  - "The Teleport menu shows when direct teleport is locked."
  - "Initial spawn-zone RTP can trigger automatically when configured."
  - "Respawn random teleport can protect players from unsafe spawn loops."
  - "Use tab completion after /lkjmcsmp teleport to discover teleport actions."

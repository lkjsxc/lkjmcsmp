tips:
  - "Use /achievement to open the achievement menu."
  - "Use /ach as a short alias for /achievement."
  - "Use /achievement list to see achievement progress in chat."
  - "Use /achievement claim key to claim a completed reward."
  - "Use /lkjmcsmp achievement to open achievements from the root command."
  - "Use /lkjmcsmp achievement list for the root-command progress list."
  - "Use /lkjmcsmp achievement claim key to claim from the root command."
  - "Achievement rewards grant Points when claimed."
  - "The achievement menu shows locked, in-progress, ready, and claimed states."
  - "Achievement progress lore shows current count, target count, and percent."
  - "Completed unclaimed achievements can be clicked in the menu."
  - "Claimed achievements remain visible for history."
  - "Conversion achievements advance when you convert cobblestone."
  - "Shop achievements advance when you buy shop items."
  - "Teleport achievements advance when teleport actions complete."
  - "Home achievements advance when you create homes."
  - "Warp achievements advance when you use warps."
  - "Party achievements advance when you join or use teams."
  - "Achievement display text is localized."
  - "Use tab completion after /achievement claim to discover achievement keys."
